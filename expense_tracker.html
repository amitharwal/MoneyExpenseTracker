<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .add-expense {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .expense-list {
            margin-top: 30px;
        }

        .expense-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .expense-item:hover {
            transform: translateX(5px);
        }

        .expense-details {
            flex: 1;
        }

        .expense-date {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .expense-description {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .expense-category {
            display: inline-block;
            padding: 4px 12px;
            background: #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
        }

        .expense-amount {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-right: 20px;
        }

        .delete-btn {
            background: #ff4757;
            padding: 8px 16px;
            font-size: 14px;
        }

        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
        }

        .total-amount {
            font-size: 36px;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .expense-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .expense-amount {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Expense Tracker</h1>
            <p>Keep track of your spending</p>
        </div>

        <div class="content">
            <div class="add-expense">
                <h2>Add New Expense</h2>
                <form id="expense-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" step="0.01" min="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="What did you spend on?" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Bills">📱 Bills</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Health">🏥 Health</option>
                            <option value="Other">📌 Other</option>
                        </select>
                    </div>

                    <button type="submit">Add Expense</button>
                </form>
            </div>

            <div class="expense-list" id="expense-list">
                <!-- Expenses will be added here -->
            </div>

            <div class="total-section">
                <h3>Total Spending</h3>
                <div class="total-amount" id="total">$0.00</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize expenses from localStorage
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        // Form submission
        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const expense = {
                id: Date.now(),
                date: document.getElementById('date').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('description').value,
                category: document.getElementById('category').value
            };

            expenses.push(expense);
            saveExpenses();
            renderExpenses();

            // Reset form
            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();
        });

        function saveExpenses() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        function deleteExpense(id) {
            if (confirm('Are you sure you want to delete this expense?')) {
                expenses = expenses.filter(expense => expense.id !== id);
                saveExpenses();
                renderExpenses();
            }
        }

        function renderExpenses() {
            const expenseList = document.getElementById('expense-list');
            const totalElement = document.getElementById('total');

            // Sort expenses by date (newest first)
            const sortedExpenses = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sortedExpenses.length === 0) {
                expenseList.innerHTML = `
                    <div class="empty-state">
                        <h3>No expenses yet</h3>
                        <p>Add your first expense to get started!</p>
                    </div>
                `;
            } else {
                expenseList.innerHTML = sortedExpenses.map(expense => `
                    <div class="expense-item">
                        <div class="expense-details">
                            <div class="expense-date">${formatDate(expense.date)}</div>
                            <div class="expense-description">${expense.description}</div>
                            <span class="expense-category">${getCategoryEmoji(expense.category)} ${expense.category}</span>
                        </div>
                        <div class="expense-amount">$${expense.amount.toFixed(2)}</div>
                        <button class="delete-btn" onclick="deleteExpense(${expense.id})">Delete</button>
                    </div>
                `).join('');
            }

            // Calculate total
            const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
            totalElement.textContent = `$${total.toFixed(2)}`;
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function getCategoryEmoji(category) {
            const emojis = {
                'Food': '🍔',
                'Transport': '🚗',
                'Shopping': '🛍️',
                'Bills': '📱',
                'Entertainment': '🎬',
                'Health': '🏥',
                'Other': '📌'
            };
            return emojis[category] || '📌';
        }

        // Initial render
        renderExpenses();
    </script>
</body>
</html>
