<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Expense Tracker</title>
    <!-- Link to our CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Main container -->
    <div class="container">
        <!-- Header section -->
        <header class="header">
            <h1 class="header-title">
                <span class="icon-bounce">💰</span>
                Expense Tracker
            </h1>
            <p class="header-subtitle">Track your spending with style</p>
            <div class="server-status pulse">
                <span class="status-dot"></span>
                Connected
            </div>
        </header>

        <!-- Main content -->
        <main class="content">
            <!-- Success message (hidden by default) -->
            <div class="success-message" id="success-message">
                <span class="success-icon">✅</span>
                <span class="success-text">Success!</span>
            </div>

            <!-- Add expense form -->
            <section class="add-expense card">
                <h2 class="section-title">Add New Expense</h2>
                <form id="expense-form" class="expense-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" class="form-input"
                                   step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" class="form-input"
                               placeholder="What did you spend on?" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" class="form-input" required>
                            <option value="">Select a category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Bills">📱 Bills</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Health">🏥 Health</option>
                            <option value="Other">📌 Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Add Expense</span>
                        <span class="btn-icon">➕</span>
                    </button>
                </form>
            </section>

            <!-- Loading indicator -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading expenses...</p>
            </div>

            <!-- Expense list -->
            <section class="expense-list" id="expense-list">
                <!-- Expenses will be loaded here by JavaScript -->
            </section>

            <!-- Total section -->
            <section class="total-section card">
                <h3 class="total-title">Total Spending</h3>
                <div class="total-amount" id="total">$0.00</div>

                <!-- Export buttons -->
                <div class="export-section">
                    <button class="btn btn-export" onclick="exportToCSV()">
                        <span class="btn-icon">📊</span>
                        Export CSV
                    </button>
                    <button class="btn btn-export" onclick="exportToJSON()">
                        <span class="btn-icon">💾</span>
                        Export JSON
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Link to our JavaScript file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
